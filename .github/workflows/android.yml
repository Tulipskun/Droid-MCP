name: Android build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARED_VERSION: "2026.9.1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build bundled cloudflared
        run: |
          git clone --depth 1 --branch "$CLOUDFLARED_VERSION" https://github.com/cloudflare/cloudflared.git cloudflared
          cd cloudflared
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -mod=mod -ldflags "-X main.Version=$CLOUDFLARED_VERSION" -o ../cloudflared-android-arm64 ./cmd/cloudflared
          cd ..
          file cloudflared-android-arm64
          test -x cloudflared-android-arm64
          test "$(stat -c%s cloudflared-android-arm64)" -gt 1048576
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp cloudflared-android-arm64 app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          file app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libcloudflared.so | grep -E "Class:.*ELF64|Machine:.*AArch64"
      - name: Prepare stable debug signing
        run: |
          base64 --decode app/droid-mcp-debug.keystore.b64 > app/droid-mcp-debug.keystore
          chmod 600 app/droid-mcp-debug.keystore
      - name: Build
        run: gradle assembleDebug
      - name: Verify bundled cloudflared
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/arm64-v8a/libcloudflared\.so$"
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libcloudflared.so > /tmp/cloudflared-from-apk
          file /tmp/cloudflared-from-apk
          test "$(stat -c%s /tmp/cloudflared-from-apk)" -gt 1048576
          readelf -h /tmp/cloudflared-from-apk | grep -E "Class:.*ELF64|Machine:.*AArch64"
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Droid-MCP-$GITHUB_REF_NAME.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-MCP-debug
          path: "Droid-MCP-$GITHUB_REF_NAME.apk"
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Droid-MCP-$GITHUB_REF_NAME.apk" --title "Droid-MCP $GITHUB_REF_NAME" --generate-notes