name: Android build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "ndk;27.3.13750724" "system-images;android-35;google_apis;x86_64"

      - name: Build cloudflared Android binaries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/cloudflare/cloudflared.git /tmp/cloudflared
          cd /tmp/cloudflared
          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64"
          export CGO_ENABLED=1 GOOS=android
          export GOARCH=arm64 CC="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
          go build -trimpath -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libcloudflared.so" ./cmd/cloudflared
          export GOARCH=arm GOARM=7 CC="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang"
          go build -trimpath -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libcloudflared.so" ./cmd/cloudflared
          export GOARCH=amd64 CC="$TOOLCHAIN/bin/x86_64-linux-android21-clang"
          unset GOARM
          go build -trimpath -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libcloudflared.so" ./cmd/cloudflared
          file "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libcloudflared.so
          chmod 755 "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libcloudflared.so

      - name: Prepare stable debug signing
        run: |
          base64 --decode app/droid-mcp-debug.keystore.b64 > app/droid-mcp-debug.keystore
          chmod 600 app/droid-mcp-debug.keystore

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="v0.3.${GITHUB_RUN_NUMBER}"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "versionName=${next#v}" >> "$GITHUB_OUTPUT"
          echo "versionCode=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set APK version
        env:
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          import os, re
          s = re.sub(r'versionCode = \d+', 'versionCode = ' + os.environ["VERSION_CODE"], s)
          s = re.sub(r'versionName = "[^"]+"', 'versionName = "' + os.environ["VERSION_NAME"] + '"', s)
          p.write_text(s)
          PY

      - name: Build
        run: gradle assembleDebug

      - name: Run Android runtime test
        id: runtime_test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            set -euxo pipefail
            adb shell getprop ro.product.cpu.abi
            adb shell ls -l /system/bin/linker64
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            NATIVE_LIB_DIR=$(adb shell pm path com.tulipskun.droidmcp | sed -n '1p' | sed 's#package:\\(.*\\)/base.apk#\\1/lib/x86_64#' | tr -d '\\r')
            adb shell ls -l "$NATIVE_LIB_DIR/libcloudflared.so"
            timeout 30s adb shell "$NATIVE_LIB_DIR/libcloudflared.so" version
            adb uninstall com.tulipskun.droidmcp
            gradle connectedDebugAndroidTest

      - name: Dump emulator logs
        if: always()
        run: timeout 20s adb logcat -d -v time | tail -n 2000 || true

      - name: Fail runtime test if needed
        if: steps.runtime_test.outcome != 'success'
        run: exit 1

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/libcloudflared\.so$"
          test "$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c "lib/arm64-v8a/libcloudflared\.so$")" -eq 1
          test "$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c "lib/armeabi-v7a/libcloudflared\.so$")" -eq 1
          test "$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c "lib/x86_64/libcloudflared\.so$")" -eq 1


      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Droid-MCP.apk

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$NEW_TAG" ] && continue
            gh release view "$tag" >/dev/null 2>&1 && gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Delete previous tags
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git ls-remote --refs --tags origin |
          sed 's#refs/tags/##' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$NEW_TAG" ] && continue
            git push origin --delete "$tag" || true
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" Droid-MCP.apk             --title "Droid-MCP $RELEASE_TAG"             --generate-notes
