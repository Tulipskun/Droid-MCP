name: Android build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare stable debug signing
        run: |
          base64 --decode app/droid-mcp-debug.keystore.b64 > app/droid-mcp-debug.keystore
          chmod 600 app/droid-mcp-debug.keystore
      - name: Build
        run: gradle assembleDebug
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Eq "lib/[^/]*/libcloudflared\.so$"; then
            echo "cloudflared must not be bundled in APK"
            exit 1
          fi
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Droid-MCP.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-MCP-debug
          path: Droid-MCP.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.number == 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v0.3.0"
          fi
          gh release create "$RELEASE_TAG" Droid-MCP.apk --title "Droid-MCP $RELEASE_TAG" --generate-notes
