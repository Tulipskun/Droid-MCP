name: Android build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare stable debug signing
        run: |
          echo '' | base64 --decode > app/droid-mcp-debug.keystore
          chmod 600 app/droid-mcp-debug.keystore
      - name: Verify signing certificate
        run: |
          apksigner verify --print-certs app/droid-mcp-debug.keystore || true
      - name: Build
        run: gradle assembleDebug
      - name: Verify APK
        run: |
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-MCP-debug
          path: app/build/outputs/apk/debug/app-debug.apk
