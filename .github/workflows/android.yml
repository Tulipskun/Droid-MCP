name: Android build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build cloudflared runner
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}
          "$CLANG/aarch64-linux-android26-clang++" -O2 -fPIE -pie -Wl,--build-id=none native/cloudflared_runner.cpp -o app/src/main/jniLibs/arm64-v8a/libcloudflared_runner.so
          "$CLANG/armv7a-linux-androideabi26-clang++" -O2 -fPIE -pie -Wl,--build-id=none native/cloudflared_runner.cpp -o app/src/main/jniLibs/armeabi-v7a/libcloudflared_runner.so
          "$CLANG/x86_64-linux-android26-clang++" -O2 -fPIE -pie -Wl,--build-id=none native/cloudflared_runner.cpp -o app/src/main/jniLibs/x86_64/libcloudflared_runner.so
          "$CLANG/i686-linux-android26-clang++" -O2 -fPIE -pie -Wl,--build-id=none native/cloudflared_runner.cpp -o app/src/main/jniLibs/x86/libcloudflared_runner.so
          chmod 755 app/src/main/jniLibs/*/libcloudflared_runner.so
          file app/src/main/jniLibs/*/libcloudflared_runner.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libcloudflared_runner.so | grep -E "Class:|Type:|Machine:"
          readelf -l app/src/main/jniLibs/arm64-v8a/libcloudflared_runner.so | grep -E "INTERP|GNU_STACK"

      - name: Prepare stable debug signing
        run: |
          base64 --decode app/droid-mcp-debug.keystore.b64 > app/droid-mcp-debug.keystore
          chmod 600 app/droid-mcp-debug.keystore

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="v0.3.${GITHUB_RUN_NUMBER}"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "versionName=${next#v}" >> "$GITHUB_OUTPUT"
          echo "versionCode=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set APK version
        env:
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          import os, re
          s = re.sub(r'versionCode = \d+', 'versionCode = ' + os.environ["VERSION_CODE"], s)
          s = re.sub(r'versionName = "[^"]+"', 'versionName = "' + os.environ["VERSION_NAME"] + '"', s)
          p.write_text(s)
          PY

      - name: Build
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Eq "lib/[^/]*/libcloudflared\.so$"; then
            echo "cloudflared must not be bundled in APK"
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Droid-MCP.apk

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$NEW_TAG" ] && continue
            gh release view "$tag" >/dev/null 2>&1 && gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Delete previous tags
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git ls-remote --refs --tags origin |
          sed 's#refs/tags/##' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$NEW_TAG" ] && continue
            git push origin --delete "$tag" || true
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" Droid-MCP.apk             --title "Droid-MCP $RELEASE_TAG"             --generate-notes
