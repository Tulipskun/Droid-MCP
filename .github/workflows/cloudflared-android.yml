name: Cloudflared Android

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARED_VERSION: "2026.9.1"
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"

      - name: Build cloudflared for Android arm64
        run: |
          git clone --depth 1 --branch "$CLOUDFLARED_VERSION" \
            https://github.com/cloudflare/cloudflared.git cloudflared
          cd cloudflared
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -mod=mod \
            -ldflags "-X main.Version=$CLOUDFLARED_VERSION" \
            -o ../cloudflared-android-arm64 \
            ./cmd/cloudflared

      - name: Verify binary
        run: |
          file cloudflared-android-arm64
          test -x cloudflared-android-arm64
          test "$(stat -c%s cloudflared-android-arm64)" -gt 1048576
          sha256sum cloudflared-android-arm64 | tee cloudflared-android-arm64.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-android-arm64
          path: |
            cloudflared-android-arm64
            cloudflared-android-arm64.sha256

      - name: Publish release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view cloudflared-android >/dev/null 2>&1 || \
            gh release create cloudflared-android \
              --title "Cloudflared Android $CLOUDFLARED_VERSION" \
              --notes "Android arm64 cloudflared build for Droid-MCP."
          gh release upload cloudflared-android \
            cloudflared-android-arm64 \
            cloudflared-android-arm64.sha256 \
            --clobber
