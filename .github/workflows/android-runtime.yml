name: Android runtime test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare stable debug signing
        run: |
          base64 --decode app/droid-mcp-debug.keystore.b64 > app/droid-mcp-debug.keystore
          chmod 600 app/droid-mcp-debug.keystore

      - name: Build test APKs
        run: gradle assembleDebug assembleDebugAndroidTest

      - name: Verify APK does not bundle cloudflared
        run: |
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Eq "lib/[^/]*/libcloudflared\.so$"; then
            echo "cloudflared must not be bundled in APK"
            exit 1
          fi

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  run-on-android:
    needs: build-test-apks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: android-runtime-test-apks
          path: apks

      - name: Run on Android x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 300
          script: |
            adb install -r apks/app-debug.apk
            adb install -r apks/app-debug-androidTest.apk
            adb shell am instrument -w -r               -e class com.tulipskun.droidmcp.CloudflareTunnelRuntimeTest               com.tulipskun.droidmcp.test/androidx.test.runner.AndroidJUnitRunner
