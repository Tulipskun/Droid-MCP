name: Android runtime test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-apks:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARED_VERSION: "2026.9.1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.16248370"

      - name: Build bundled cloudflared
        run: |
          git clone --depth 1 --branch "$CLOUDFLARED_VERSION"             https://github.com/cloudflare/cloudflared.git cloudflared
          cd cloudflared

          GOOS=android GOARCH=arm64 CGO_ENABLED=0             go build -trimpath -mod=mod             -ldflags "-X main.Version=$CLOUDFLARED_VERSION"             -o ../cloudflared-android-arm64             ./cmd/cloudflared

          NDK="$ANDROID_SDK_ROOT/ndk/30.0.16248370"
          export CC_FOR_TARGET="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang++"
          export CC_FOR_TARGET="$CC"
          export CXX_FOR_TARGET="$CXX"
          export CGO_ENABLED=1
          GOOS=android GOARCH=amd64 go env CGO_ENABLED CC CXX CC_FOR_TARGET CXX_FOR_TARGET
          GOOS=android GOARCH=amd64             go build -trimpath -mod=mod             -ldflags "-X main.Version=$CLOUDFLARED_VERSION"             -o ../cloudflared-android-amd64             ./cmd/cloudflared

          cd ..

          test -x cloudflared-android-arm64
          test -x cloudflared-android-amd64
          test "$(stat -c%s cloudflared-android-arm64)" -gt 1048576
          test "$(stat -c%s cloudflared-android-amd64)" -gt 1048576

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

          cp cloudflared-android-arm64 app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          cp cloudflared-android-amd64 app/src/main/jniLibs/x86_64/libcloudflared.so

          readelf -h app/src/main/jniLibs/arm64-v8a/libcloudflared.so |             grep -E "Class:.*ELF64|Machine:.*AArch64"
          readelf -h app/src/main/jniLibs/x86_64/libcloudflared.so |             grep -E "Class:.*ELF64|Machine:.*Advanced Micro Devices X86-64"

      - name: Prepare stable debug signing
        run: |
          base64 --decode app/droid-mcp-debug.keystore.b64 > app/droid-mcp-debug.keystore
          chmod 600 app/droid-mcp-debug.keystore

      - name: Build test APKs
        run: gradle assembleDebug assembleDebugAndroidTest

      - name: Verify bundled cloudflared in APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk |             grep -E "lib/(arm64-v8a|x86_64)/libcloudflared\.so$"

          unzip -p app/build/outputs/apk/debug/app-debug.apk             lib/arm64-v8a/libcloudflared.so > /tmp/cloudflared-arm64
          unzip -p app/build/outputs/apk/debug/app-debug.apk             lib/x86_64/libcloudflared.so > /tmp/cloudflared-x86_64

          test "$(stat -c%s /tmp/cloudflared-arm64)" -gt 1048576
          test "$(stat -c%s /tmp/cloudflared-x86_64)" -gt 1048576

          readelf -h /tmp/cloudflared-arm64 |             grep -E "Class:.*ELF64|Machine:.*AArch64"
          readelf -h /tmp/cloudflared-x86_64 |             grep -E "Class:.*ELF64|Machine:.*Advanced Micro Devices X86-64"

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  run-on-android:
    needs: build-test-apks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: android-runtime-test-apks
          path: apks

      - name: Run on Android x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 300
          script: |
            adb install -r apks/app-debug.apk
            adb install -r apks/app-debug-androidTest.apk
            adb shell am instrument -w -r               -e class com.tulipskun.droidmcp.CloudflareTunnelRuntimeTest               com.tulipskun.droidmcp.test/androidx.test.runner.AndroidJUnitRunner
